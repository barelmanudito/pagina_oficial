name: Actualizar calendario y publicar página

on:
  push:
    branches:
      - main

  schedule:
    # Todos los días a las 6:17 a. m. de Costa Rica
    - cron: "17 12 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Actualizar partidos de Primera División
        run: node scripts/actualizar-partidos.mjs

      - name: Guardar calendario actualizado
        run: |
          if git diff --quiet -- data/calendario.csv; then
            echo "El calendario ya estaba actualizado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/calendario.csv
            git commit -m "Actualizar partidos de Primera División"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la página
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
