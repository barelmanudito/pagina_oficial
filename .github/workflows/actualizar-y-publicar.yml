name: Actualizar calendario y publicar página

on:
  push:
    branches:
      - main

  schedule:
    # Todos los días a las 6:17 a. m. de Costa Rica
    - cron: "17 12 * * *"

  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read

    steps:
      - name: Descargar archivos del repositorio
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar menu
        run: python scripts/preparar-menu.py

      - name: Comprobar calendario sin consultar ESPN
        run: node scripts/probar-calendario.mjs

      - name: Combinar eventos y partidos guardados
        if: github.event_name == 'push'
        run: node scripts/actualizar-partidos.mjs --sin-consultar-partidos

      - name: Consultar partidos de ESPN
        if: github.event_name != 'push'
        run: node scripts/actualizar-partidos.mjs

      - name: Guardar calendario actualizado
        run: |
          if git diff --quiet -- data/calendario.csv data/resultados.csv data/eventos.json menu-data.js; then
            echo "El calendario ya estaba actualizado."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add data/calendario.csv data/resultados.csv data/eventos.json menu-data.js
            git commit -m "Actualizar partidos de Primera División"
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar archivos de la página
        id: subir-pagina
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Confirmar la subida del paquete de la página
        env:
          ARTIFACT_ID: ${{ steps.subir-pagina.outputs.artifact_id }}
        run: |
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "::error::La subida del paquete github-pages no devolvió un identificador."
            exit 1
          fi

  publicar:
    needs: actualizar-y-publicar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
