<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title description">
  <title id="title">Bar cerrado</title>
  <desc id="description">Aviso rojinegro que indica que el Bar El Manudito está cerrado.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090a"/>
      <stop offset="1" stop-color="#202024"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="800" height="520" rx="46" fill="url(#bg)"/>
  <path d="M0 88h800v28H0zM0 404h800v28H0z" fill="#f20b18"/>
  <g filter="url(#shadow)">
    <rect x="92" y="135" width="616" height="250" rx="32" fill="#f7f7f5" stroke="#f20b18" stroke-width="14"/>
    <text x="400" y="278" fill="#0b0b0c" font-family="Impact,Arial Black,sans-serif" font-size="116" text-anchor="middle" letter-spacing="8">CERRADO</text>
    <text x="400" y="338" fill="#a3000a" font-family="Arial,sans-serif" font-size="29" font-weight="800" text-anchor="middle" letter-spacing="5">BAR EL MANUDITO</text>
  </g>
</svg>
